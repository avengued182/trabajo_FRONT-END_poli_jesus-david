<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../">
    <title>Noticias | Nexo Noticias</title>

    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components/navbar.css">
    <link rel="stylesheet" href="assets/css/components/login-modal.css">
    <link rel="stylesheet" href="assets/css/components/register-modal.css">
    <link rel="stylesheet" href="assets/css/components/footer.css">
    <link rel="stylesheet" href="assets/css/pages/site-pages.css">
</head>
<body data-page="noticias">

    <header id="app-header"></header>

    <main id="news-list-page" class="page-shell">
        <div class="page-container">

            <nav class="page-breadcrumb" aria-label="Ruta de navegación">
                <a href="index.html">Inicio</a>
                <span>›</span>
                <a href="pages/noticias.html">Noticias</a>
                <span>›</span>
                <span id="news-list-breadcrumb-category">Todas</span>
            </nav>

            <header class="page-heading page-heading--news">
                <span class="page-kicker"></span>
                <div class="page-heading__row">
                    <div>
                        <h1 id="news-list-title">Todas las noticias</h1>
                        <p id="news-list-subtitle">
                            Explora las publicaciones más recientes de Nexo Noticias y filtra por la temática que te interese.
                        </p>
                    </div>
                    <a class="page-secondary-button" href="pages/categorias.html">
                        Explorar categorías →
                    </a>
                </div>
            </header>

            <section class="news-toolbar" aria-label="Filtros de noticias">
                <div class="category-tabs category-tabs--all">
                    <button class="category-tab is-active" data-categoria="todas" type="button">Todas</button>
                    <button class="category-tab" data-categoria="educacion" type="button">Educación</button>
                    <button class="category-tab" data-categoria="tecnologia" type="button">Tecnología</button>
                    <button class="category-tab" data-categoria="turismo" type="button">Turismo</button>
                    <button class="category-tab" data-categoria="comercio" type="button">Comercio</button>
                </div>
                <span id="news-list-count" class="news-count">0 noticias</span>
            </section>

            <section id="news-list-grid" class="news-list-grid" aria-live="polite"></section>

            <div class="news-list-load">
                <button id="btn-load-more" class="page-primary-button" type="button">
                    ↻ Cargar más noticias
                </button>
            </div>
        </div>
    </main>

    <footer id="app-footer" class="site-footer"></footer>

    <script src="assets/js/vendor/jquery.min.js"></script>
    <script src="assets/js/models/noticia.model.js"></script>
    <script src="assets/js/services/session.service.js"></script>
    <script src="assets/js/services/noticias.service.js"></script>
    <script src="assets/js/services/favoritos.service.js"></script>
    <script src="assets/js/services/notificaciones.service.js"></script>
    <script src="assets/js/components/navbar.js"></script>
    <script src="assets/js/components/login-modal.js"></script>
    <script src="assets/js/components/register-modal.js"></script>
    <script src="assets/js/components/footer.js"></script>
    <script src="assets/js/controllers/navbar.controller.js"></script>
    <script src="assets/js/controllers/login.controller.js"></script>
    <script src="assets/js/controllers/register.controller.js"></script>
    <script src="assets/js/controllers/footer.controller.js"></script>
    <script src="assets/js/controllers/noticias.controller.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
